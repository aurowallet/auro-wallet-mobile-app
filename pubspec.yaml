name: auro_wallet
description: MinaWallet made with Flutter.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.3.0+1192

environment:
  sdk: ">=3.9.0 <4.0.0"

publish_to: none

dependencies:
  # intl - format numbers
  intl: ^0.20.2
  json_annotation: ^4.10.0
  # state management with mobx & provider
  mobx: ^2.6.0
  flutter_mobx: ^2.2.2
  shared_preferences: ^2.5.4
  get_storage: ^2.1.1
  convert: ^3.0.0
  http: ^1.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  #  device_info: ^0.4.2
  fluttertoast: ^9.0.0
  bip39: 1.0.6
  roundcheckbox: ^2.0.5
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # QR code generator & reader
  qr_flutter: ^4.1.0
  permission_handler: ^12.0.1
  # svg renderer
  flutter_svg: ^2.2.3
  # open link in browser
  url_launcher: ^6.3.1
  # GraphQL
  graphql_flutter: ^5.2.0
  flutter_easyloading: ^3.0.5
  bs58check: ^1.0.2
  percent_indicator: ^4.2.5
  flutter_secure_storage: ^9.2.4
  safe_device: ^1.3.8
  encrypt: ^5.0.3
  bip32: ^2.0.0
  hex: ^0.2.0
  webcrypto:
    git:
      url: https://github.com/emersion/webcrypto.dart.git
      ref: d178309fd4b5c389656325919e71eb6dbaa6f235
  styled_text: ^9.0.0
  dropdown_button2: ^2.3.9
  dotted_line: ^3.1.0
  ledger_flutter:
    git:
      url: https://github.com/aurowallet/ledger-flutter.git
      ref: master
  decimal: ^3.2.1
  flutter_inappwebview: ^6.1.5
  cached_network_image: ^3.4.1
  sodium_libs: ^3.4.6+4
  app_links: ^6.4.0
  local_auth: ^2.3.0
  local_auth_android: ^1.0.51
  share_plus: ^12.0.1
  mobile_scanner: ^7.1.4
  reown_walletkit: ^1.3.8
  flutter_local_notifications: ^18.0.1
  wakelock_plus: ^1.4.0



dev_dependencies:
  build_runner: ^2.4.15
  mobx_codegen: ^2.7.6
  json_serializable: ^6.12.0
  mockito: ^5.6.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_phoenix: ^1.0.0
  freezed: ^3.2.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/public/app.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/public/splash_screen.png"
  #  branding: "assets/images/public/splash_screen.png"
  android_12:
    color: "#ffffff"
    image: "assets/images/public/splash_screen_android.png"
  #    branding: "assets/images/public/splash_screen.png"
  android_gravity: center
  ios_content_mode: center

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

